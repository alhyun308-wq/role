<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FDA4AF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="chickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D97706" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 바닥 그림자 -->
  <ellipse cx="100" cy="180" rx="55" ry="12" fill="#E2E8F0"/>

  <g filter="url(#chickShadow)">
    <!-- 작은 날개 (왼쪽) -->
    <path d="M 45 105 C 20 115 25 145 52 135 C 56 125 52 110 45 105 Z" fill="#FBBF24"/>

    <!-- 몸통 (동글동글한 병아리) -->
    <circle cx="100" cy="105" r="62" fill="url(#bodyGrad)"/>

    <!-- 머리 삐죽 깃털 -->
    <path d="M 98 44 C 95 28 108 26 102 44 Z" fill="#F59E0B"/>
    <path d="M 104 45 C 108 24 118 28 108 45 Z" fill="#F59E0B"/>

    <!-- 학사모/학생 모자 -->
    <g transform="translate(15, -15)">
      <polygon points="90,30 135,45 85,60 40,45" fill="url(#hatGrad)"/>
      <rect x="62" y="52" width="50" height="14" rx="4" fill="#3730A3"/>
      <!-- 모자 수술 -->
      <circle cx="85" cy="45" r="4" fill="#FDE047"/>
      <path d="M 85 45 Q 120 50 125 72" stroke="#FDE047" stroke-width="3" fill="none"/>
      <circle cx="125" cy="74" r="5" fill="#F59E0B"/>
    </g>

    <!-- 초롱초롱한 눈 -->
    <!-- 왼쪽 눈 -->
    <ellipse cx="78" cy="98" rx="8" ry="12" fill="#1E1B4B"/>
    <circle cx="76" cy="93" r="4" fill="#FFFFFF"/>
    <circle cx="81" cy="103" r="2" fill="#FFFFFF"/>

    <!-- 오른쪽 눈 (윙크하거나 방긋 웃는 표정) -->
    <path d="M 115 98 Q 125 90 135 98" stroke="#1E1B4B" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- 발그레한 볼터치 -->
    <ellipse cx="64" cy="115" rx="14" ry="9" fill="url(#cheekGrad)"/>
    <ellipse cx="132" cy="115" rx="14" ry="9" fill="url(#cheekGrad)"/>

    <!-- 주황색 부리 -->
    <path d="M 92 108 Q 104 100 116 108 Q 104 126 92 108 Z" fill="#EA580C"/>
    <path d="M 95 110 Q 104 116 113 110" stroke="#C2410C" stroke-width="2" fill="none"/>

    <!-- 작은 날개 (오른쪽 - 인사하며 별봉 들고 있음) -->
    <path d="M 150 105 C 175 90 180 120 155 130 Z" fill="#FBBF24"/>
    
    <!-- 별 요술봉 -->
    <g transform="translate(158, 65) rotate(15)">
      <line x1="10" y1="18" x2="2" y2="60" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <!-- 별 -->
      <polygon points="10,0 13,8 22,8 15,14 18,22 10,17 2,22 5,14 -2,8 7,8" fill="#FACC15" stroke="#EAB308" stroke-width="1.5"/>
    </g>

    <!-- 노란 발 두 개 -->
    <path d="M 80 162 L 72 174 L 84 174 Z" fill="#EA580C" rx="2"/>
    <path d="M 115 162 L 107 174 L 119 174 Z" fill="#EA580C" rx="2"/>
  </g>
</svg>
