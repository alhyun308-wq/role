<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- 주사위 큐브 그래디언트 -->
    <linearGradient id="diceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="diceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="diceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- 노란 작은 주사위 그래디언트 -->
    <linearGradient id="yellowTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="yellowLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="yellowRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4338CA" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 바닥 타원 그림자 -->
  <ellipse cx="120" cy="205" rx="75" ry="18" fill="#E2E8F0"/>

  <!-- 주사위 1 (메인 보라/인디고 주사위 3D 등각 투영) -->
  <g filter="url(#boxShadow)" transform="translate(10, -5)">
    <!-- 윗면 -->
    <polygon points="110,60 165,85 110,110 55,85" fill="url(#diceTop)"/>
    <!-- 윗면 점 (3개) -->
    <circle cx="85" cy="85" r="4.5" fill="#4338CA"/>
    <circle cx="110" cy="85" r="4.5" fill="#4338CA"/>
    <circle cx="135" cy="85" r="4.5" fill="#4338CA"/>

    <!-- 왼쪽 면 -->
    <polygon points="55,85 110,110 110,175 55,150" fill="url(#diceLeft)"/>
    <!-- 왼쪽 면 점 (5개) -->
    <circle cx="70" cy="115" r="4.5" fill="#FFFFFF"/>
    <circle cx="95" cy="125" r="4.5" fill="#FFFFFF"/>
    <circle cx="82" cy="130" r="4.5" fill="#FFFFFF"/>
    <circle cx="70" cy="140" r="4.5" fill="#FFFFFF"/>
    <circle cx="95" cy="150" r="4.5" fill="#FFFFFF"/>

    <!-- 오른쪽 면 -->
    <polygon points="110,110 165,85 165,150 110,175" fill="url(#diceRight)"/>
    <!-- 오른쪽 면 점 (1개 큰 빨간 포인트) -->
    <circle cx="138" cy="130" r="8.5" fill="#EF4444"/>
    <circle cx="140" cy="128" r="3" fill="#FECACA"/>
  </g>

  <!-- 주사위 2 (보조 노란색 미니 주사위 3D) -->
  <g transform="translate(135, 115) scale(0.65)" filter="url(#boxShadow)">
    <polygon points="60,30 95,48 60,65 25,48" fill="url(#yellowTop)"/>
    <circle cx="60" cy="48" r="4" fill="#B45309"/>

    <polygon points="25,48 60,65 60,110 25,92" fill="url(#yellowLeft)"/>
    <circle cx="36" cy="72" r="3.5" fill="#FFFFFF"/>
    <circle cx="48" cy="85" r="3.5" fill="#FFFFFF"/>

    <polygon points="60,65 95,48 95,92 60,110" fill="url(#yellowRight)"/>
    <circle cx="74" cy="74" r="3.5" fill="#FFFFFF"/>
    <circle cx="83" cy="88" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- 주위에 떠다니는 축제 별과 반짝이 -->
  <g>
    <!-- 황금 별 1 -->
    <polygon points="45,45 49,55 60,55 52,62 55,72 45,66 35,72 38,62 30,55 41,55" fill="#FBBF24"/>
    <!-- 반짝이 2 -->
    <path d="M 185 45 Q 195 45 195 35 Q 195 45 205 45 Q 195 45 195 55 Q 195 45 185 45 Z" fill="#38BDF8"/>
    <!-- 반짝이 3 -->
    <path d="M 30 135 Q 40 135 40 125 Q 40 135 50 135 Q 40 135 40 145 Q 40 135 30 135 Z" fill="#F472B6"/>
    <!-- 미니 스파클 -->
    <circle cx="195" cy="95" r="4" fill="#FDE047"/>
    <circle cx="65" cy="25" r="3" fill="#A78BFA"/>
  </g>
</svg>
